# Settings for the contributor bot (scripts/bot/atlas_bot.py), in one place
# so the numbers in CONTRIBUTING and GOVERNANCE have a single source.
# The bot reads this file from the default branch.

bot:
  login: inferstep-atlas-bot[bot]   # only this account's comments count as the bot's

claims:
  ping_after_days: 10      # no open PR of theirs names the issue by then: the claimant gets a reminder
  release_after_days: 14    # still none: the claim is released and the issue is Ready again
  max_open: 2               # open claims per contributor
  max_open_first_timer: 1   # before their first merged pull request

project:
  owner: inferstep
  number: 1

links:
  contributing: https://github.com/inferstep/ATLAS/blob/main/CONTRIBUTING.md
  start_here: https://github.com/orgs/inferstep/projects/1/views/1

rfc_dedupe:
  max_links: 5

# The size label and the risk label of a pull request
# (scripts/bot/pr_labels.py says what each is computed from).
pull_requests:
  # The smallest number of changed lines for each size label. The lines of
  # a file that a tool writes (not_counted) are left out.
  sizes:
    S: 0
    M: 100
    L: 400
    XL: 1000
  # A pull request of this size or larger is high risk.
  high_risk_from: L
  risk_label: risk:high
  # End of a path -> what the file is.
  not_counted:
    package-lock.json: a lock file
    go.sum: a lock file
    .github/requirements/ci.txt: a lock file
  # Path -> what it is. A pull request that changes one is high risk. An
  # entry is one file, a folder with all that is in it (it ends with "/"),
  # or the start of a name (it ends with "*").
  core_paths:
    proxy/agent.go: the agent loop
    proxy/tools.go: the tool handlers
    proxy/gates.go: the guards
    proxy/guardrails.go: the guards
    proxy/permissions.go: the guards
    proxy/authorization_*: the guards
    proxy/shell_wrapper.go: the guards
    proxy/confined_dir.go: the guards
    sandbox/executor_server.py: the guards
    sandbox/resource_contract.py: the guards
    .github/workflows/: the workflows
    .github/actions/: the workflows

# Path prefix -> area label, for pull requests. A file can match several.
areas:
  proxy/: area/proxy
  tui/: area/tui
  atlas/: area/cli
  v3-service/: area/v3
  geometric-lens/: area/lens
  inference/: area/inference
  sandbox/: area/sandbox
  extensions/: area/extensions
  scripts/: area/install
  docker-compose: area/install
  .github/: area/ci
  docs/: area/docs
  README.md: area/docs

# A fix that lands on this branch closes the issues its commit or pull
# request names with "Closes #N" (GitHub does that only on main). The words
# count where they start a line, outside a fenced block; a sentence that
# quotes them closes nothing.
done:
  branch: dev
  lookback_days: 3          # how far back each sync looks
