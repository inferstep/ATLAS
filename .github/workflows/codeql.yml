name: codeql

# GitHub's semantic security scanner. Same engine that powers their
# security advisories — catches SQL/command/path injection, hardcoded
# credentials, unsafe deserialization, weak crypto, and other classes
# the test/lint workflows can't see. Free for public repos and uses
# its own runner pool, so it doesn't eat install/test minutes.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # The merge queue runs the required checks on the merged result before it
  # lands. A workflow without this trigger reports nothing there, and the
  # queue waits for its checks until it times out.
  merge_group:
    types: [checks_requested]
    branches: [main, dev]
  # Re-scan weekly even without commits — query packs are updated by
  # GitHub regularly and a stale code base can pick up new findings.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

# No token scopes by default; the job below asks for what it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # Required to write findings to the Security tab.
      security-events: write
      # Required for actions/checkout on private repos; harmless on public.
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, go, javascript-typescript, java-kotlin]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup-go must run BEFORE codeql init: init injects a traced go
      # wrapper into PATH, and a later setup-go would repoint PATH at the
      # toolcache go, bypassing CodeQL's build tracing.
      - name: setup go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # 1.26.6 covers both modules (tui requires 1.26.6+ via go.mod;
          # proxy's 1.24 floor builds fine on it). setup-go v6 pins
          # GOTOOLCHAIN=local, so the version here must satisfy every
          # module — no auto-fetch.
          go-version: '1.26.6'
          # The modules live in proxy/ and tui/ (no root go.mod); without
          # this the default cache lookup warns and never caches.
          cache-dependency-path: |
            proxy/go.sum
            tui/go.sum

      # Java/Kotlin needs a different init than the other three: Kotlin is
      # a compiled language, so build-mode manual means we compile it
      # ourselves further down and CodeQL observes that compile. The
      # existing init keeps the default build mode for python, go and
      # javascript-typescript (the JS extractor reads source directly).
      - name: setup java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: init codeql (java-kotlin)
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: init codeql (${{ matrix.language }})
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # security-and-quality runs the broader pack — catches both
          # security bugs and general correctness issues. Default
          # security-extended is also fine; we pick the wider one
          # because we already gate Pyflakes via ruff.
          queries: security-and-quality

      - name: build go modules
        # CodeQL needs to observe a real compile to extract dataflow.
        # autobuild can't handle our two-module layout (proxy/ + tui/)
        # so we do it manually. Each module's `go build ./...` is enough
        # for extraction — we don't need the artifacts.
        if: matrix.language == 'go'
        run: |
          (cd proxy && go build ./...)
          (cd tui   && go build ./...)

      # The Kotlin plugin is a Gradle build, and CodeQL only extracts
      # Kotlin from a compile it observes. Force the plugin's compileKotlin
      # task to actually run: --rerun defeats the task's own up-to-date
      # check, --no-build-cache defeats the cache, and in-process keeps the
      # Kotlin compiler in the JVM CodeQL instruments — the Kotlin compiler
      # daemon is a separate process that --no-daemon does not cover.
      - name: build kotlin (forced, in-process)
        if: matrix.language == 'java-kotlin'
        working-directory: extensions/jetbrains
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            :compileKotlin --rerun 2>&1 | tee kotlin-compile.log

      # A skipped Kotlin compile extracts nothing and the leg would pass
      # while scanning zero Kotlin, so fail loudly instead. The negative
      # check uses `if grep; then exit 1` rather than `! grep`, which does
      # not fail the step under `set -e`.
      - name: assert the kotlin compile ran
        if: matrix.language == 'java-kotlin'
        working-directory: extensions/jetbrains
        run: |
          set -euo pipefail
          if grep -Eq '^> Task :compileKotlin (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED)$' kotlin-compile.log; then
            echo "::error::the Kotlin compile was skipped (see kotlin-compile.log); CodeQL would extract nothing"
            exit 1
          fi
          for task in ':compileKotlin'; do
            if ! grep -Eq "^> Task ${task}$" kotlin-compile.log; then
              echo "::error::$task did not run (see kotlin-compile.log)"
              exit 1
            fi
          done
          echo "ok: the Kotlin compile executed"

      - name: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
