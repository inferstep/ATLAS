name: golangci-lint

# Lints the Go modules on the code a change adds (settings in .golangci.yml).
# It reports as annotations and does not fail the job: --issues-exit-code=0.
# The linter is installed with `go install`, so the job needs no action from
# outside GitHub and the organisation's allow-list stays as it is.

on:
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: golangci-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [proxy, tui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # New-code mode compares with the base commit, so it has to be here.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: install golangci-lint
        # Built from source at a fixed version. Go's checksum database
        # verifies what it downloads.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: the base to compare with
        id: base
        # The base branch as it is now, not as it was when the event was
        # made; see scripts/change_base.py. The base branch's copy of that
        # script gives the answer, so a change cannot choose its own base.
        # The change's copy runs only while the base has none.
        run: |
          if git cat-file -e "HEAD^1:scripts/change_base.py" 2>/dev/null; then
            git show "HEAD^1:scripts/change_base.py" > "$RUNNER_TEMP/change_base.py"
          else
            cp scripts/change_base.py "$RUNNER_TEMP/change_base.py"
          fi
          sha=$(python3 "$RUNNER_TEMP/change_base.py")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: golangci-lint on new code
        working-directory: ${{ matrix.module }}
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          golangci-lint run ./... --new-from-rev="$BASE" --issues-exit-code=0 \
            --output.text.path=stdout --output.json.path="$RUNNER_TEMP/lint.json"

      - name: annotate the findings
        env:
          MODULE: ${{ matrix.module }}
        run: |
          # The report names files from the repo root, where .golangci.yml is.
          jq -r '.Issues // [] | .[]
            | "::warning file=\(.Pos.Filename),line=\(.Pos.Line),title=golangci-lint (\(.FromLinter))::\(.Text | gsub("\n"; " "))"' \
            "$RUNNER_TEMP/lint.json"
          echo "golangci-lint, $MODULE: $(jq '.Issues // [] | length' "$RUNNER_TEMP/lint.json") finding(s) in new code" \
            | tee -a "$GITHUB_STEP_SUMMARY"
