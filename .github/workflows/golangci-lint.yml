name: golangci-lint

# Lints the Go modules on the code a change adds (settings in .golangci.yml).
# It reports as annotations and does not fail the job: --issues-exit-code=0.

on:
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: golangci-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [proxy, tui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # New-code mode compares with the base commit, so it has to be here.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          args: >-
            --new-from-rev=${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
            --issues-exit-code=0
