name: bot · new issue

# When an issue is opened: welcome a first-time author, and for an RFC or
# Feature, link open RFCs and Epics with similar titles. The title is read
# from the API, never interpolated into a command.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  new-issue:
    if: github.repository == 'inferstep/ATLAS'
    runs-on: ubuntu-24.04
    environment:
      name: bots
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/bot
            .github/atlas-bot.yml
          sparse-checkout-cone-mode: false

      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.ATLAS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ATLAS_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Welcome a first-time author
        run: python3 scripts/bot/atlas_bot.py welcome
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

      - name: Link related RFCs and Epics
        run: python3 scripts/bot/atlas_bot.py rfc-dedupe
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
