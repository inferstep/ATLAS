name: dependency review

# Fails a pull request that adds a dependency with a known high or
# critical vulnerability, before it merges. Reads the dependency graph
# only; runs no PR code. Fork PRs get the read-only token, which is all
# this needs.
on:
  pull_request:
    branches: [main, dev]
  # The merge queue runs the required checks on the merged result before it
  # lands. A workflow without this trigger reports nothing there, and the
  # queue waits for its checks until it times out.
  # The review action reads a merge group's base and head commits from the
  # event, so it compares the same range it would on the pull request.
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
