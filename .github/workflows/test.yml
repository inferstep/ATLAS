name: tests

# Runs on every push to main/dev and every PR. All jobs run on the free
# ubuntu-latest runner — no GPU, no large model downloads, no real
# Docker compose stack. The install-test.yml workflow handles the
# distro-matrix bootstrap dry-run; this file is for code-level checks
# (Go test, Python pytest, shellcheck, compose validate).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-flight runs on the same ref when a newer commit lands —
# saves runner minutes on rapid-fire pushes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-tests:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [proxy, tui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # 1.26 covers both modules (tui requires 1.26+ via go.mod;
          # proxy's 1.24 floor builds fine on it). setup-go v6 pins
          # GOTOOLCHAIN=local, so the version here must satisfy every
          # module — no auto-fetch.
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go test -race
        run: python scripts/production-readiness.py --only go-${{ matrix.module }}-test

      - name: go vet
        run: python scripts/production-readiness.py --only go-${{ matrix.module }}-vet

      - name: staticcheck
        run: python scripts/production-readiness.py --only go-${{ matrix.module }}-staticcheck

  python-tests:
    name: pytest (${{ matrix.subset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tests/v3/, tests/v3-service/, tests/cli/, and geometric-lens/tests/
        # are pure unit tests — no services needed. tests/infrastructure/ is
        # mixed: test_llm.py + test_sandbox.py carry the `integration` marker
        # (they need a live llama-server / sandbox stack, so they are
        # hardware-gated and do not run in GitHub-hosted CI; deterministic
        # control-plane coverage is the e2e-acceptance job below), while the
        # compose and CPU-image checks are static file assertions that run
        # anywhere.
        subset:
          - tests/v3
          - tests/v3-service
          - tests/cli
          - tests/infrastructure
          - tests/contracts
          - tests/concurrency
          - tests/perf
          - geometric-lens/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          # Default cache key only tracks requirements*.txt; include
          # pyproject.toml so dependency changes there rotate the cache.
          cache-dependency-path: |
            pyproject.toml
            **/requirements*.txt

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pyyaml: tests/contracts/test_openapi_contract.py importorskips
          # yaml — without the install the whole route-parity contract
          # silently skips instead of gating.
          pip install pytest pyyaml
          # tree-sitter + grammars for the call-graph/structural_edit tests
          # under tests/v3-service/, at the exact pins the image ships —
          # an unpinned install once pulled a newer tree-sitter whose API
          # change made extraction silently return empty. Only the
          # tree-sitter lines: the file's torch pin resolves from the
          # pytorch CPU index, not PyPI, and these tests don't need torch.
          grep -E '^tree-sitter' v3-service/requirements.txt | xargs pip install

      - name: install sandbox runtime dependencies
        # tests/infrastructure needs these too: the boundary-regression
        # suite boots sandbox/executor_server.py, which imports
        # fastapi/pydantic unconditionally.
        if: matrix.subset == 'tests/v3-service' || matrix.subset == 'tests/infrastructure'
        run: pip install -r sandbox/requirements-runtime.txt

      - name: install lens dependencies (CPU torch)
        if: matrix.subset == 'geometric-lens/tests'
        # Mirrors geometric-lens/Dockerfile: CPU-only torch wheel (the
        # CUDA default is ~2 GB and pointless on a CPU runner), then the
        # service requirements. xgboost tests importorskip if absent, but
        # requirements.txt pins xgboost-cpu so they run here.
        run: |
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r geometric-lens/requirements.txt

      - name: pytest
        run: python scripts/production-readiness.py --only python-tests --pytest-path "${{ matrix.subset }}"

  perf-gate:
    name: perf budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: proxy/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Build proxy (for binary-size metric)
        run: cd proxy && go build -o /tmp/test-atlas-proxy .
      - name: Measure + gate against budgets
        run: |
          ATLAS_PROXY_BINARY=/tmp/test-atlas-proxy \
            python -m tests.perf.harness measure > /tmp/perf.json
          python -m tests.perf.harness check /tmp/perf.json

  ruff:
    name: ruff (python lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: test integrity + compile + min-python + dockerfile check
        # test-integrity runs tests/validate_tests.py (the weakened-test
        # linter); python-compile is a whole-tree syntax check; min-python
        # compares the tree against pyproject's requires-python floor, which
        # the matrix above cannot do because it only runs 3.11/3.12;
        # dockerfile-sources checks every COPY source still exists, which
        # otherwise fails only in the image-build job. All are static — no
        # dependencies beyond the stdlib.
        run: |
          python scripts/production-readiness.py \
            --only test-integrity \
            --only python-compile \
            --only min-python \
            --only dockerfile-sources

      - name: ruff check
        # --select F is Pyflakes — real-bug rules (undefined names, redefined
        # symbols, local-before-assign, string-format errors). The three
        # codes ignored are pure style noise we don't gate on:
        #   F401 unused-import   F541 empty-f-string   F841 unused-variable
        # Bug-catchers like F821 (undefined name) and F823 (local var
        # referenced before assignment) stay on. Tighten later by removing
        # entries from --ignore as the codebase gets cleaner.
        run: |
          pip install ruff
          python scripts/production-readiness.py --only ruff

      - name: mypy (typed modules)
        run: |
          pip install mypy
          python scripts/production-readiness.py --only mypy-typed

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        # --severity=error catches real bugs (unquoted vars in dangerous
        # contexts, misuse of [[ ]], etc) without bikeshedding on style.
        # Bump to `warning` later once the scripts are stable.
        run: python scripts/production-readiness.py --only shellcheck

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: validate compose YAML
        # The runner has docker compose v2 pre-installed. `config -q`
        # parses + validates the base file plus every overlay combination
        # real installs run (ROCm, Vulkan, Vulkan+CPU, macOS) without
        # pulling images. Dummy env is supplied by the gate itself.
        run: |
          python scripts/production-readiness.py \
            --only compose \
            --only compose-rocm \
            --only compose-vulkan \
            --only compose-cpu \
            --only compose-macos

  yamllint:
    name: yamllint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: yamllint
        run: |
          pip install yamllint
          python scripts/production-readiness.py --only workflow-yaml

  e2e-acceptance:
    # Deterministic end-to-end acceptance tests (tests/e2e/): real proxy
    # binary + real sandbox executor + scripted fake llama-server.
    # test_acceptance.py drives the direct agent path (read -> edit ->
    # sandbox verification -> interactive permission -> done);
    # test_v3_lens_acceptance.py boots the REAL v3-service and drives
    # the differentiated pipeline (probe -> lens-calibrated k ->
    # PlanSearch candidates -> per-candidate lens scoring -> sandbox
    # verification -> lens winner selection), asserting V3 was not
    # bypassed, lens scoring was called, and the lens-preferred
    # candidate landed on disk — plus V3-unreachable/malformed/timeout
    # and lens-unreachable failure modes. No GPU, no model download.
    name: e2e acceptance (proxy + sandbox + fake llama)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: proxy/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            **/requirements*.txt

      - name: build proxy
        run: cd proxy && go build -o /tmp/test-atlas-proxy .

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
          pip install -r sandbox/requirements-runtime.txt

      - name: e2e acceptance test
        env:
          ATLAS_PROXY_BINARY: /tmp/test-atlas-proxy
        # -rs surfaces any skip loudly; the grep turns an all-skipped run
        # into a hard failure so the acceptance test can't silently stop
        # gating (skipif is for local dev boxes, never for this job).
        run: |
          python -m pytest tests/e2e -v -rs --no-header | tee /tmp/e2e.out
          if grep -q "SKIPPED" /tmp/e2e.out; then
            echo "::error::e2e acceptance test skipped in CI — its preconditions are this job's responsibility"
            exit 1
          fi

  llama-patches-apply:
    # Smoke test: verifies the PC-202 hidden-states + spec-decode
    # patches still apply cleanly against the pinned LLAMA_CPP_REV.
    # Added after 2026-05-20 build failure where upstream llama.cpp
    # drift shifted server-context.cpp by 1 line and broke the patch
    # silently — caught only when the 36-min Docker build tried to
    # apply it. This job catches the same class of failure in ~30s
    # before the publish workflow burns runner time on a doomed build.
    #
    # When this fails: see docs/TROUBLESHOOTING.md § "llama.cpp patch
    # drift" for the bump runbook.
    name: llama.cpp patches apply to pinned SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: extract LLAMA_CPP_REV + check Dockerfiles agree
        id: sha
        # All four Dockerfiles (Dockerfile, Dockerfile.v31, Dockerfile.rocm,
        # Dockerfile.vulkan) must agree on the pinned SHA. Disagreement
        # would mean a bump landed in one place but not the others,
        # which would publish inconsistent llama-server binaries across
        # backends.
        run: |
          SHA=$(grep -oP '(?<=ARG LLAMA_CPP_REV=)[a-f0-9]+' inference/Dockerfile.v31 | head -1)
          if [ -z "$SHA" ]; then
            echo "::error::could not extract LLAMA_CPP_REV from inference/Dockerfile.v31"
            exit 1
          fi
          echo "Pinned SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          for f in inference/Dockerfile inference/Dockerfile.rocm inference/Dockerfile.vulkan; do
            if ! grep -q "LLAMA_CPP_REV=$SHA" "$f"; then
              actual=$(grep -oP '(?<=ARG LLAMA_CPP_REV=)[a-f0-9]+' "$f" | head -1)
              echo "::error file=$f::LLAMA_CPP_REV mismatch — found '$actual', expected '$SHA' (matches Dockerfile.v31). Bump all 4 Dockerfiles together."
              exit 1
            fi
          done
          echo "All 4 Dockerfiles agree on LLAMA_CPP_REV=$SHA"

      - name: fetch pinned llama.cpp
        # Mirror the production fetch pattern: init + shallow-fetch a
        # specific SHA, not a full clone. GitHub supports
        # uploadpack.allowReachableSHA1InWant so this is cheap (~30s).
        run: |
          git init -q llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          git -c http.postBuffer=524288000 \
              fetch --depth 1 origin ${{ steps.sha.outputs.sha }}
          git checkout -q FETCH_HEAD

      - name: apply patches dry-run
        # Two things the Dockerfiles actually do on the cloned llama.cpp
        # tree before cmake; we mirror them both here:
        #   1. `git apply` of expose-hidden-states.patch (PC-202).
        #      Hard-fails the Docker build if it doesn't apply.
        #   2. `sed -i '/auto params_dft = params_base;/a ...'` for the
        #      spec-decode embeddings fix. The sed has `|| true`, so a
        #      missing target line would silently no-op... we verify the
        #      target line exists so that doesn't go unnoticed. The sed
        #      IS the patch — there is no separate .patch file for it.
        run: |
          cd llama.cpp
          # 1. PC-202 hidden-states patch
          patch_path=../inference/patches/expose-hidden-states.patch
          if git apply --check "$patch_path" 2>&1; then
            echo "  OK: expose-hidden-states.patch applies to ${{ steps.sha.outputs.sha }}"
          else
            echo "::error file=inference/patches/expose-hidden-states.patch::patch does not apply to LLAMA_CPP_REV=${{ steps.sha.outputs.sha }}. See docs/TROUBLESHOOTING.md § 'llama.cpp patch drift' for the bump runbook."
            exit 1
          fi
          # 2. spec-decode embeddings fix (sed target must exist)
          if grep -q 'auto params_dft = params_base;' tools/server/server-context.cpp; then
            echo "  OK: spec-decode sed target present in server-context.cpp"
          else
            echo "::error::Dockerfile sed target 'auto params_dft = params_base;' not found in tools/server/server-context.cpp at LLAMA_CPP_REV=${{ steps.sha.outputs.sha }}. The embeddings spec-decode fix would silently no-op. See docs/TROUBLESHOOTING.md § 'llama.cpp patch drift'."
            exit 1
          fi
          echo "All patch checks passed."

  container-smoke:
    # One image build per language used to mean four identical `docker build
    # ./sandbox` runs (and four chances to hit an upstream package-mirror
    # flake). The matrix keeps the same four verdicts on one job definition.
    name: ${{ matrix.language }} sandbox smoke (containerized)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            code: 'public class Main { public static void main(String[] args) { System.out.println("ok"); } }'
          - language: kotlin
            code: 'fun main() { println("ok") }'
          - language: ruby
            code: 'puts "ok"'
          - language: php
            code: '<?php echo "ok";'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: build sandbox image
        run: docker build -t atlas-sandbox-test ./sandbox
      - name: start sandbox
        run: |
          docker run -d --name sandbox-test -p 8020:8020 atlas-sandbox-test
          sleep 5
      - name: smoke test /execute + /syntax-check
        env:
          CODE: ${{ matrix.code }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          # Build the request body with python so the sample code is never
          # re-quoted by the shell — that quoting is what forced four
          # hand-escaped copies of these two curls in the first place.
          body="$(python3 -c 'import json,os; print(json.dumps({"code": os.environ["CODE"], "language": os.environ["LANGUAGE"]}))')"
          for endpoint in execute syntax-check; do
            curl -sf -X POST "http://localhost:8020/$endpoint" \
              -H 'Content-Type: application/json' -d "$body" \
              | ENDPOINT="$endpoint" python3 -c "import sys,json,os; e=os.environ['ENDPOINT']; d=json.load(sys.stdin); k='success' if e=='execute' else 'valid'; assert d[k], d; print(f'PASS: /{e}')"
          done
      - name: cleanup
        if: always()
        run: docker rm -f sandbox-test || true
