name: install matrix

# Dry-runs scripts/atlas-bootstrap.sh inside the Tier-1 distro containers
# we officially support. Skips Docker install (containers can't run
# Docker-in-Docker without --privileged), NVIDIA setup (no GPU on free
# runners), model download (7GB), and compose-up — what's left is
# everything that actually breaks on real installs:
#
#   - distro detection
#   - .env handling + missing-key patching
#   - repo step (chown, ownership detection)
#   - Python CLI install (pip + ~/.local/bin handling)
#   - Go install (tarball + extract + PATH)
#   - atlas-tui build (proves Go + module path + build steps work)
#
# That's the surface where PC-051+ install bugs have actually lived.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-dry-run:
    name: bootstrap on ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: 'ubuntu-22.04', image: 'ubuntu:22.04', pkg: 'apt' }
          - { name: 'ubuntu-24.04', image: 'ubuntu:24.04', pkg: 'apt' }
          - { name: 'debian-12',    image: 'debian:12',    pkg: 'apt' }
          # rockylinux/rockylinux is the maintained namespace; the
          # Docker-library `rockylinux` image stopped receiving updates.
          - { name: 'rockylinux-9', image: 'rockylinux/rockylinux:9', pkg: 'dnf' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: bootstrap inside ${{ matrix.distro.image }}
        run: |
          docker run --rm \
            -v "$PWD":/atlas:ro \
            -w /work \
            -e ATLAS_BOOTSTRAP_SKIP_DOCKER=1 \
            -e ATLAS_BOOTSTRAP_SKIP_GPU=1 \
            -e ATLAS_BOOTSTRAP_SKIP_MODELS=1 \
            -e ATLAS_BOOTSTRAP_SKIP_COMPOSE=1 \
            ${{ matrix.distro.image }} \
            bash -c '
              set -euo pipefail

              # Install the prereqs the bootstrap assumes are present.
              # `curl ca-certificates git python3 sudo tar` is the
              # baseline; pip + lspci come from the bootstrap path.
              if command -v apt-get &>/dev/null; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  curl ca-certificates git python3 python3-pip python3-venv \
                  sudo tar gnupg lsb-release pciutils >/dev/null
              else
                # rocky/rhel image — minimal install. --allowerasing lets
                # full `curl` swap in for the preinstalled `curl-minimal`
                # (Rocky 9 base ships curl-minimal which conflicts with
                # the full curl this dnf line pulls).
                dnf install -y -q --allowerasing \
                  curl ca-certificates git python3 python3-pip \
                  sudo tar gnupg pciutils which >/dev/null
              fi

              # Copy the read-only checkout to a writable workspace —
              # the bootstrap chown-s + writes .env, so /atlas:ro fails.
              # Use -T (no-target-directory) so contents land in /work
              # itself; plain `cp -r /atlas /work` would nest them at
              # /work/atlas/ (because -w /work pre-creates the dir).
              cp -rT /atlas /work
              cd /work

              # Run the bootstrap. With all skip flags set, this exercises
              # ensure_repo_and_env, install_atlas_cli, install_go,
              # build_atlas_tui — the parts that historically broke.
              ./scripts/atlas-bootstrap.sh

              # Repeat the exact install to catch upgrade/idempotency failures.
              ./scripts/atlas-bootstrap.sh

              # Verify the artifacts the bootstrap was supposed to leave.
              echo
              echo "=== Verifying bootstrap outputs ==="

              # 1. .env exists and has the required keys
              for key in ATLAS_MODELS_DIR ATLAS_MODEL_FILE ATLAS_MODEL_NAME ATLAS_CTX_SIZE; do
                grep -q "^${key}=" .env || { echo "::error::.env missing $key"; exit 1; }
              done
              # Model selection must be NON-EMPTY after bootstrap — an empty
              # ATLAS_MODEL_FILE kills download-models.sh and composes
              # ${ATLAS_MODEL_FILE:?} guard. The bootstrap defaults it to the
              # registry recommendation when .env.example ships it blank.
              for key in ATLAS_MODEL_FILE ATLAS_MODEL_NAME; do
                grep -Eq "^${key}=..*" .env \
                  || { echo "::error::.env has empty $key after bootstrap"; exit 1; }
              done
              echo "✓ .env has all required keys (model selection non-empty)"

              # 2. Python CLI is installed and importable
              python3 -m atlas.commands.doctor --help >/dev/null \
                || { echo "::error::atlas Python CLI not importable"; exit 1; }
              echo "✓ atlas Python module installed"

              # 3. atlas binary exists in $HOME/.local/bin (pip --user target)
              # Running as root inside container, so $HOME=/root.
              test -x /root/.local/bin/atlas \
                || { echo "::error::/root/.local/bin/atlas not built"; ls -la /root/.local/bin/ || true; exit 1; }
              echo "✓ atlas binary at /root/.local/bin/atlas"

              # 4. atlas-tui Go binary built
              test -x /root/.local/bin/atlas-tui \
                || { echo "::error::/root/.local/bin/atlas-tui not built"; ls -la /root/.local/bin/ || true; exit 1; }
              echo "✓ atlas-tui binary at /root/.local/bin/atlas-tui"

              # 5. Go is on PATH (or under /usr/local/go/bin)
              [[ -x /usr/local/go/bin/go ]] || command -v go >/dev/null \
                || { echo "::error::go not installed"; exit 1; }
              echo "✓ go installed: $(/usr/local/go/bin/go version 2>/dev/null || go version)"

              # 6. PATH entries remain usable and are not duplicated on rerun.
              bash -lc "command -v atlas >/dev/null" \
                || { echo "::error::atlas not available in a login shell"; exit 1; }
              [[ $(grep -Fc "/usr/local/go/bin" /root/.profile) -eq 1 ]] \
                || { echo "::error::Go PATH entry duplicated in /root/.profile"; exit 1; }
              echo "✓ repeat install is idempotent and login-shell PATH works"

              echo
              echo "=== ${{ matrix.distro.name }}: PASS ==="
            '

  bootstrap-sudo-user:
    name: bootstrap via sudo for a regular user
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: bootstrap as root with a non-root target owner
        run: |
          docker run --rm \
            -v "$PWD":/atlas:ro \
            -w /work \
            -e ATLAS_BOOTSTRAP_SKIP_DOCKER=1 \
            -e ATLAS_BOOTSTRAP_SKIP_GPU=1 \
            -e ATLAS_BOOTSTRAP_SKIP_MODELS=1 \
            -e ATLAS_BOOTSTRAP_SKIP_COMPOSE=1 \
            ubuntu:24.04 \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                curl ca-certificates git python3 python3-pip python3-venv \
                sudo tar gnupg lsb-release pciutils >/dev/null

              useradd --create-home --shell /bin/bash atlas-user
              cp -rT /atlas /work
              cd /work

              export SUDO_USER=atlas-user
              ./scripts/atlas-bootstrap.sh
              ./scripts/atlas-bootstrap.sh

              test "$(stat -c %U /work)" = atlas-user \
                || { echo "::error::checkout is not owned by atlas-user"; exit 1; }
              test -x /home/atlas-user/.local/bin/atlas \
                || { echo "::error::atlas CLI was not installed for atlas-user"; exit 1; }
              test -x /home/atlas-user/.local/bin/atlas-tui \
                || { echo "::error::atlas-tui was not installed for atlas-user"; exit 1; }
              sudo -H -u atlas-user bash -lc "command -v atlas >/dev/null && atlas --help >/dev/null" \
                || { echo "::error::atlas is unavailable to atlas-user in a login shell"; exit 1; }
              [[ $(grep -Fc "/usr/local/go/bin" /home/atlas-user/.profile) -eq 1 ]] \
                || { echo "::error::Go PATH entry duplicated for atlas-user"; exit 1; }

              # A missing core prerequisite must fail before the ready banner.
              python_path=$(command -v python3)
              mv "$python_path" "${python_path}.disabled"
              set +e
              ./scripts/atlas-bootstrap.sh >/tmp/atlas-missing-python.log 2>&1
              missing_python_rc=$?
              set -e
              mv "${python_path}.disabled" "$python_path"
              [[ $missing_python_rc -ne 0 ]] \
                || { echo "::error::bootstrap succeeded without Python"; exit 1; }
              ! grep -q "ATLAS is ready" /tmp/atlas-missing-python.log \
                || { echo "::error::bootstrap printed ready after CLI failure"; exit 1; }

              echo "=== sudo/non-root repeat install: PASS ==="
            '
