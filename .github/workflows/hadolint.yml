name: hadolint

# Lints every Dockerfile the repository tracks (scripts/dockerfile_lint.py).
# A finding does not fail the job: the counts are in the job summary, and the
# findings in a Dockerfile the change touches are annotations. The job fails
# when the lint did not lint: no Dockerfile, hadolint did not run, or hadolint
# could not read a Dockerfile.
# hadolint is its release binary at a fixed version, held against the checksum
# recorded below, so the job needs no action from outside GitHub and the
# organisation's allow-list stays as it is.

on:
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: hadolint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: hadolint (dockerfiles)
    runs-on: ubuntu-24.04
    env:
      # To move to a new version, change both lines in one pull request. The
      # checksum is the one for hadolint-linux-x86_64 in checksums.sha256 of
      # that release.
      HADOLINT_VERSION: v2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The base commit has to be here, to know which Dockerfiles the change touches.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: install hadolint
        run: |
          curl --silent --show-error --fail --location --retry 3 --output "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          if ! echo "${HADOLINT_SHA256}  ${RUNNER_TEMP}/hadolint" | sha256sum --check --status; then
            echo "::error::The hadolint ${HADOLINT_VERSION} download does not match the checksum this workflow records, so it was not run. Fix: compare the download with checksums.sha256 of that release. If the release is right, record its checksum in this workflow; if it is not, do not use the download."
            exit 1
          fi
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --version

      - name: lint the Dockerfiles
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python scripts/dockerfile_lint.py --hadolint "$RUNNER_TEMP/hadolint" --changed-from "$BASE"
