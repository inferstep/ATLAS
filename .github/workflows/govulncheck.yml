name: govulncheck

# Reports the known vulnerabilities that the Go modules' code can reach. A
# finding whose vulnerable function the code calls fails the job; one in a
# package the code imports but never calls into is listed and does not. The
# standard library's findings depend on the Go version, so the job uses the Go
# of the test jobs (a test holds the two the same). govulncheck is installed
# with `go install`, so the job needs no action from outside GitHub.

on:
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The module's name labels its checks; dir is the folder it is in.
        module: [proxy, tui]
        include:
          - module: proxy
            dir: services/proxy
          - module: tui
            dir: clients/tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: ${{ matrix.dir }}/go.mod

      - name: install govulncheck
        # Built from source at a fixed version. Go's checksum database
        # verifies what it downloads.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck
        working-directory: ${{ matrix.dir }}
        # Without -show verbose a finding only in an imported package is
        # counted and not named. The exit status is the same either way.
        run: govulncheck -show verbose ./...
