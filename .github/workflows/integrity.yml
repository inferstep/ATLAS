name: integrity

# Reads the change for the ways it can weaken the checks themselves: tests
# removed or loosened, history in new comments, evaluation task names in
# product code, new documents, changes to the files that configure the checks.
# It reports as annotations and in the job summary. It does not fail the job.

on:
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: integrity check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The diff needs the base commit as well as the head.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: the base to compare with
        id: base
        # The base branch as it is now, not as it was when the event was
        # made; see scripts/change_base.py. The base branch's copy of that
        # script gives the answer, so a change cannot choose its own base.
        # The change's copy runs only when the parent commit is here and has
        # no copy, as on a pull request into a branch that has none yet.
        run: |
          if ! git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
            echo "::error::The parent of the checked-out commit is not in this checkout, so the base cannot be read and no script was run. Fix: give the checkout step of this job fetch-depth 0 (or 2 or more) and no ref."
            exit 1
          fi
          if git cat-file -e "HEAD^1:scripts/change_base.py" 2>/dev/null; then
            git show "HEAD^1:scripts/change_base.py" > "$RUNNER_TEMP/change_base.py"
          else
            cp scripts/change_base.py "$RUNNER_TEMP/change_base.py"
          fi
          sha=$(python3 "$RUNNER_TEMP/change_base.py")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: integrity check
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          # The base branch's copy of the script judges the change, so a
          # change cannot rewrite its own judge. The change's copy runs only
          # while the base has none.
          if git cat-file -e "$BASE:scripts/integrity_check.py" 2>/dev/null; then
            git show "$BASE:scripts/integrity_check.py" > "$RUNNER_TEMP/integrity_check.py"
          else
            cp scripts/integrity_check.py "$RUNNER_TEMP/integrity_check.py"
          fi
          python "$RUNNER_TEMP/integrity_check.py" --root "$GITHUB_WORKSPACE" --base "$BASE" --github
