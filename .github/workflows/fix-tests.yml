name: fix tests

# For a pull request that fixes a bug: runs the tests it adds or changes on
# the base's code and on the pull request, and says which of them fail without
# the fix (scripts/fix_tests.py). A test that passes both times does not guard
# the fix. It reports and does not fail the job for any verdict; the job fails
# only when the check could not do its work.
# It starts again when the title is edited, because the title says whether the
# pull request is a fix.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: fix-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-tests:
    name: fix tests (fail without the fix)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The merge commit and its two parents: the base is the first one.
          fetch-depth: 2
          persist-credentials: false

      - name: the base to compare with
        id: base
        # The base branch as it is now, not as it was when the event was
        # made; see scripts/change_base.py. The base branch's copy of that
        # script gives the answer, so a change cannot choose its own base.
        # The change's copy runs only when the parent commit is here and has
        # no copy, as on a pull request into a branch that has none yet.
        run: |
          if ! git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
            echo "::error::The parent of the checked-out commit is not in this checkout, so the base cannot be read and no script was run. Fix: give the checkout step of this job fetch-depth 0 (or 2 or more) and no ref."
            exit 1
          fi
          if git cat-file -e "HEAD^1:scripts/change_base.py" 2>/dev/null; then
            git show "HEAD^1:scripts/change_base.py" > "$RUNNER_TEMP/change_base.py"
          else
            cp scripts/change_base.py "$RUNNER_TEMP/change_base.py"
          fi
          sha=$(python3 "$RUNNER_TEMP/change_base.py")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: install what the tests need
        # The same packages as the pytest jobs, without the lens: its tests
        # are named as not judged.
        run: |
          pip install --require-hashes -r .github/requirements/ci.txt
          pip install --no-deps -e .
          grep -E '^tree-sitter' v3-service/requirements.txt | xargs pip install
          pip install -r sandbox/requirements-runtime.txt
          grep -E '^jinja2==' sandbox/requirements-verify.txt | xargs pip install

      - name: the new tests of a fix, without the fix and with it
        env:
          BASE: ${{ steps.base.outputs.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The base branch's copy of the script judges the change, so a
          # change cannot rewrite its own judge. The change's copy runs only
          # while the base has none.
          mkdir -p "$RUNNER_TEMP/judge"
          for name in fix_tests.py integrity_check.py; do
            if git cat-file -e "$BASE:scripts/fix_tests.py" 2>/dev/null; then
              git show "$BASE:scripts/$name" > "$RUNNER_TEMP/judge/$name"
            else
              cp "scripts/$name" "$RUNNER_TEMP/judge/$name"
            fi
          done
          python "$RUNNER_TEMP/judge/fix_tests.py" --root "$GITHUB_WORKSPACE" --base "$BASE" --title "$TITLE" --github
