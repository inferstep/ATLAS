name: scorecard

# OpenSSF Scorecard: scores the repo's security practices (branch
# protection, pinned actions, token permissions, signed releases, …),
# publishes the result for the README badge, and uploads findings to the
# Security tab. Scheduled runs use the default branch's copy of this file.
on:
  schedule:
    - cron: '30 4 * * 1'   # weekly, Monday 04:30 UTC
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch: {}

permissions: {}

jobs:
  analysis:
    name: scorecard analysis
    # Publishing is tied to this repo's identity; a fork has nothing to publish.
    if: github.repository == 'inferstep/ATLAS'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write   # upload the SARIF to the Security tab
      id-token: write          # publish_results signs the result with the workflow identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: results.sarif
