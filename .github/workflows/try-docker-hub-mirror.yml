name: try docker hub mirror

# A try by hand on a branch of its own. It is never merged. The third run
# showed that a builder whose own image is named at the mirror builds with
# Docker Hub pointed to nowhere. This run is its control: the same builder
# with no mirror in its own settings has to fail at its base images. If it
# passes, the block does not reach the builder and the third run showed
# nothing about the base images.

on:
  push:
    branches: ['try/docker-hub-mirror']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: try-docker-hub-mirror
  cancel-in-progress: true

env:
  HUB: registry-1.docker.io auth.docker.io production.cloudflare.docker.com

jobs:
  builder-control:
    name: builder control, no mirror in the builder's settings (the build has to fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: point Docker Hub to nowhere
        run: echo "0.0.0.0 $HUB" | sudo tee -a /etc/hosts
      # zizmor asks for the `$/` form here; actionlint does not read that form yet.
      - uses: ./.github/actions/docker-hub-mirror  # zizmor: ignore[self-repository]
      - name: set up the builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          # The runner's own network is for this try alone: it is how the
          # block of Docker Hub reaches the builder's container.
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
            network=host
      - name: build the proxy image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: false
          provenance: false
          no-cache: true
      - name: the control has to fail
        env:
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "the build: $BUILD (has to be failure)"
          if [ "$BUILD" != failure ]; then
            echo "::error::The control passed: the builder reached Docker Hub, so the block does not reach it and the third run showed nothing about the base images."
            exit 1
          fi

  builder-with-mirror:
    name: builder with the mirror in its settings (the build has to pass)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: point Docker Hub to nowhere
        run: echo "0.0.0.0 $HUB" | sudo tee -a /etc/hosts
      # zizmor asks for the `$/` form here; actionlint does not read that form yet.
      - uses: ./.github/actions/docker-hub-mirror  # zizmor: ignore[self-repository]
      - name: set up the builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: build the proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: false
          provenance: false
          no-cache: true
