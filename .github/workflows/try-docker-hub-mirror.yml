name: try docker hub mirror

# A try by hand on a branch of its own. It is never merged. The first run
# showed: with the mirror in the settings of the Docker service and Docker
# Hub pointed to nowhere, a pull still fails. This run asks why. Each check
# keeps its own result; the last step prints them. The job's own colour is
# not the verdict.

on:
  push:
    branches: ['try/docker-hub-mirror']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: try-docker-hub-mirror
  cancel-in-progress: true

env:
  HUB: registry-1.docker.io auth.docker.io production.cloudflare.docker.com
  PYTHON_IMAGE: docker.io/library/python:3.13-slim@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b

jobs:
  diagnose:
    name: why a pull goes to Docker Hub with a mirror set
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: point Docker Hub to nowhere
        run: |
          echo "0.0.0.0 $HUB" | sudo tee -a /etc/hosts
          if curl -s -o /dev/null -m 10 https://registry-1.docker.io/v2/; then
            echo "::error::Docker Hub still answers after the block, so this try shows nothing."
            exit 1
          fi
      # zizmor asks for the `$/` form here; actionlint does not read that form yet.
      - uses: ./.github/actions/docker-hub-mirror  # zizmor: ignore[self-repository]
      - name: the state of the runner
        run: |
          echo '```'
          docker info 2>/dev/null | grep -E "Server Version|Storage Driver|Username|Registry Mirrors|mirror|Registry:" || true
          echo "the user's Docker settings name a login for: $(python3 -c 'import json,os,sys; p=os.path.expanduser("~/.docker/config.json"); print(sorted(json.load(open(p)).get("auths", {})) if os.path.exists(p) else "no settings file")')"
          curl -s -o /dev/null -m 15 -w 'the mirror answers with status %{http_code}\n' https://mirror.gcr.io/v2/ || echo "the mirror gave no answer"
          echo '```'
      - name: A. a pull by the mirror's own name
        id: a
        continue-on-error: true
        run: docker pull mirror.gcr.io/library/ubuntu:22.04
      - name: B. a pull of ubuntu:22.04 with the runner's login
        id: b
        continue-on-error: true
        run: |
          since="$(date '+%Y-%m-%d %H:%M:%S')"
          status=0
          docker pull ubuntu:22.04 || status=$?
          echo "What the Docker service wrote for this pull:"
          echo '```'
          sudo journalctl --unit docker --since "$since" --no-pager --output cat 2>&1 | tail -n 40
          echo '```'
          exit "$status"
      - name: C. the same kind of pull with no login
        id: c
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/no-login"
          since="$(date '+%Y-%m-%d %H:%M:%S')"
          status=0
          DOCKER_CONFIG="$RUNNER_TEMP/no-login" docker pull debian:12 || status=$?
          echo "What the Docker service wrote for this pull:"
          echo '```'
          sudo journalctl --unit docker --since "$since" --no-pager --output cat 2>&1 | tail -n 40
          echo '```'
          exit "$status"
      - name: D1. a plain docker build from the pinned digest, with the runner's login
        id: d1
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/small" && printf 'FROM %s\nRUN true\n' "$PYTHON_IMAGE" > "$RUNNER_TEMP/small/Dockerfile"
          docker build --no-cache -t try-small-1 "$RUNNER_TEMP/small"
      - name: D2. the same build with no login
        id: d2
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/no-login"
          DOCKER_CONFIG="$RUNNER_TEMP/no-login" docker build --no-cache -t try-small-2 "$RUNNER_TEMP/small"
      - name: E. a pull by the pinned digest, with no login
        id: e
        continue-on-error: true
        run: DOCKER_CONFIG="$RUNNER_TEMP/no-login" docker pull "$PYTHON_IMAGE"
      - name: the results
        env:
          A: ${{ steps.a.outcome }}
          B: ${{ steps.b.outcome }}
          C: ${{ steps.c.outcome }}
          D1: ${{ steps.d1.outcome }}
          D2: ${{ steps.d2.outcome }}
          E: ${{ steps.e.outcome }}
        run: |
          echo "A, by the mirror's own name:            $A"
          echo "B, ubuntu:22.04 with the login:         $B"
          echo "C, debian:12 with no login:             $C"
          echo "D1, plain build with the login:         $D1"
          echo "D2, plain build with no login:          $D2"
          echo "E, pinned digest with no login:         $E"
