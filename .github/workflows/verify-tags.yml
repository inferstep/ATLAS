name: Verify release tag signature

# Release tags (vX.Y.Z) must be SSH-signed by a key listed in
# .github/allowed_signers. This gate fails a tag push whose signature is
# missing or unrecognized, so an unsigned or unauthorized release tag
# can't stand.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need the tag object + its target

      - name: Verify the tag is signed by an allowed signer
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Verifying signature on tag: $TAG"
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          if ! git cat-file tag "$TAG" | grep -q "SSH SIGNATURE"; then
            echo "::error::Tag $TAG is not SSH-signed. Cut releases with scripts/release-tag.sh."
            exit 1
          fi
          if git verify-tag "$TAG"; then
            echo "Tag $TAG signature verified against .github/allowed_signers."
          else
            echo "::error::Tag $TAG signature did not verify against an allowed signer."
            exit 1
          fi
