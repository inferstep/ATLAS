name: pr title

# The PR title becomes the squash commit title, so it must be a
# conventional commit with the component as scope: `type(scope): summary`,
# e.g. `fix(proxy): …` or `docs(setup): …`. A `!` after the scope marks a
# breaking change. The title gives the heading of the changelog entry.
#
# The text of the entry comes from the PR text, its part under "What users
# will notice". scripts/release/release_changelog.py --check reads that part
# with the rules the release uses, so a part the release can't use fails here
# and not at the release.
#
# The title and the text are read from the event payload through
# environment variables, never interpolated into the script, so crafted
# text can't run as shell. The checkout keeps no token.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]
  # The merge queue waits for every required check, this one included. A
  # merge group has no title: the title is checked on the pull request, which
  # must pass before it can enter the queue.
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions: {}

jobs:
  pr-title:
    name: pr title
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Nothing to check in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The title was checked on the pull request. A merge group has no title of its own."

      - name: Check the title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|chore|refactor|perf|test|build|ci|revert|style'
          # Dependabot writes its own titles, and a group title can pass 100
          # characters after a rebase (#180). Check its format, not its length.
          len='{0,99}'
          if [[ "$AUTHOR" == "dependabot[bot]" ]]; then len='*'; fi
          re="^($types)\\([a-z0-9][a-z0-9._/-]*\\)!?:\\ [^[:space:]].${len}\$"
          if [[ "$TITLE" =~ $re ]]; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "::error::PR title must look like 'type(scope): summary', e.g. 'fix(proxy): stop the retry loop'."
          echo "::error::type is one of: ${types//|/, }. scope is the component in lowercase (proxy, tui, cli, v3, lens, sandbox, inference, install, ci, docs, zh-cn, …). Keep it under 100 characters."
          echo "got: $TITLE"
          exit 1

      # Dependabot writes its own text; the release puts its PRs together as one line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          persist-credentials: false

      - name: Check the part for users in the text
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s' "$TITLE" "$BODY" | python3 scripts/release/release_changelog.py --check -
