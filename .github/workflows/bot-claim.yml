name: bot · claim

# `/claim` and `/unclaim` as the first line of an issue comment. Runs the
# default branch's copy of the bot (issue_comment events always do); it
# writes issue and project metadata only, and reads pull requests to count
# the merged ones of the person who claims. The comment text is passed in
# the event file, never interpolated into a command.
on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: bot-claim-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      github.repository == 'inferstep/ATLAS' && !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-24.04
    environment:
      name: bots
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/bot
            .github/atlas-bot.yml
          sparse-checkout-cone-mode: false

      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.ATLAS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ATLAS_BOT_PRIVATE_KEY }}
          permission-issues: write
          # The claim limit is wider after a first merged pull request, and
          # a search shows only what the token may read: without this right
          # every person counts as new.
          permission-pull-requests: read
          permission-organization-projects: write

      - run: python3 scripts/bot/atlas_bot.py claim
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
