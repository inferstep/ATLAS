name: smoke result

# A change to text that every request to the model carries (the system prompt
# with the tool descriptions, the grammar, the schema of the reply) needs a
# smoke run with a real model before it merges. The recordings of the replay
# tests show such a change exactly. This job reads them, and for such a pull
# request it is red until the text of the pull request has the result line of
# a smoke run that was made with that text (scripts/smoke_result.py).
#
# The job starts no smoke run and reaches no server: a maintainer starts the
# run by hand. It reads the text of the pull request from the event, through
# an environment variable, never as part of a command. It runs no code of the
# change: its one script is the base branch's copy, and the change's copy only
# while the base has none. Not a required check.
on:
  pull_request:
    branches: [main, dev]
    # `edited`: the result line comes into the text of the pull request by an
    # edit, and the job has to read the new text.
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]
    branches: [main, dev]

permissions:
  contents: read

# No concurrency group: an edit of the text starts a second run for the same
# commit, and a cancelled run of a commit would read as a job that did not
# run. Each run takes a few seconds.
jobs:
  smoke-result:
    name: smoke result
    runs-on: ubuntu-24.04
    steps:
      - name: Nothing to check in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The result line was checked on the pull request. A merge group has no text of its own."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The recordings are read from the base commit and from the head commit.
          fetch-depth: 0
          persist-credentials: false

      - name: the base to compare with
        id: base
        if: github.event_name == 'pull_request'
        # The base branch as it is now, not as it was when the event was
        # made; see scripts/change_base.py. The base branch's copy of that
        # script gives the answer, so a change cannot choose its own base.
        # The change's copy runs only when the parent commit is here and has
        # no copy, as on a pull request into a branch that has none yet.
        run: |
          if ! git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
            echo "::error::The parent of the checked-out commit is not in this checkout, so the base cannot be read and no script was run. Fix: give the checkout step of this job fetch-depth 0 (or 2 or more) and no ref."
            exit 1
          fi
          if git cat-file -e "HEAD^1:scripts/change_base.py" 2>/dev/null; then
            git show "HEAD^1:scripts/change_base.py" > "$RUNNER_TEMP/change_base.py"
          else
            cp scripts/change_base.py "$RUNNER_TEMP/change_base.py"
          fi
          sha=$(python3 "$RUNNER_TEMP/change_base.py")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: the smoke result of a change to text that every request carries
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The base branch's copy of the script judges the change, so a
          # change cannot rewrite its own judge. The change's copy runs only
          # while the base has none. The head of the pull request is the
          # second parent of the checked-out merge.
          if git cat-file -e "$BASE:scripts/smoke_result.py" 2>/dev/null; then
            git show "$BASE:scripts/smoke_result.py" > "$RUNNER_TEMP/smoke_result.py"
          else
            cp scripts/smoke_result.py "$RUNNER_TEMP/smoke_result.py"
          fi
          python3 "$RUNNER_TEMP/smoke_result.py" --base "$BASE" --head "$(git rev-parse HEAD^2)"
