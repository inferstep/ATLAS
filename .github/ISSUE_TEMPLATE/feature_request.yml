name: Feature request
description: Propose an improvement or new capability
type: Feature
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Architecture changes, new dependencies, security-model changes, release policy, support-matrix changes, and breaking changes need an **RFC** instead. Use the RFC form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do and where ATLAS fell short. Concrete workflows help more than abstract capabilities.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What you'd want to happen instead. If there are multiple ways to get there, name the trade-off you'd pick.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds tried
      description: Anything you already tried (config, prompts, other tools) and why it wasn't enough.
