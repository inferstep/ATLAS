version: 2
# Version updates target dev, where all changes land (GOVERNANCE). Security
# updates always target the default branch (main) and are retargeted by hand.
updates:
  - package-ecosystem: github-actions
    # "/" is the workflows. The pins inside the composite actions of
    # .github/actions are not read from there, so their folders are named.
    directories: ["/", "/.github/actions/*"]
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    # /.github/requirements holds CI's hashed lock (ci.in and ci.txt). Some
    # pins of ci.in are copies of pins in the sandbox and v3-service files
    # (a contract test holds them the same), so both folders sit in the same
    # group: one pull request then moves a pin in both places and makes the
    # lock again.
    directories: ["/", "/.github/requirements"]
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # setuptools >=83 requires python >=3.10, but RHEL9-family hosts
      # (a supported bootstrap target) build the CLI from pyproject on
      # system python 3.9. Revisit when the py3.9 floor is dropped.
      - dependency-name: "setuptools"
      # torch is pinned twice per service: requirements.txt and the
      # Dockerfile's CPU-only pre-install, which must match
      # (tests/contracts/test_torch_cpu_pin.py). Dependabot can bump only
      # the first, so torch is bumped by hand in both places.
      - dependency-name: "torch"

  - package-ecosystem: gomod
    directory: /proxy
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tui
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # The JetBrains plugin is its own Gradle build under extensions/jetbrains.
  # The IntelliJ Platform Gradle Plugin and the IntelliJ Platform version are
  # pinned in the build and stay hand-managed: bumping the platform is a
  # compatibility decision (sinceBuild, Kotlin API level), not a routine
  # bump.
  #
  # Ktor is hand-managed too, and for a sharper reason. Ktor 3.5.0 moved to
  # kotlinx-coroutines 1.11.0, which hoisted Job.invokeOnCompletion$default
  # onto the Job interface; IntelliJ Platform 2026.1 bundles coroutines 1.10.2,
  # where that synthetic lives in Job$DefaultImpls. The plugin uses the
  # platform's coroutines (it must not ship a second copy), so Ktor 3.5+
  # throws NoSuchMethodError on its first request. Re-pin only after checking
  # the coroutines the target platform bundles; the mock-proxy tests in
  # AtlasClientTest fail loudly on a bump past 3.4.3.
  - package-ecosystem: gradle
    directory: /extensions/jetbrains
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      - dependency-name: "io.ktor:*"
        versions: [">= 3.5.0"]

  - package-ecosystem: docker
    directories:
      - /proxy
      - /v3-service
      - /sandbox
      - /geometric-lens
      - /inference
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Base-image majors are deliberate migrations, not routine bumps:
    # a CUDA major must match the host driver ceiling and rebuild the
    # llama image against the pinned llama.cpp patches, and a Python
    # major moves the lens/sandbox interpreter under pinned torch
    # wheels. Digest and minor/patch updates still flow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Docker tags aren't semver: the python interpreter version rides
      # the MINOR component (3.11 -> 3.14), and moving it is the same
      # deliberate migration as a major (pinned torch wheels, lens/
      # sandbox interpreter). Patch + digest updates still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
