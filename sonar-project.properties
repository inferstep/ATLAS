# Settings for the SonarQube Cloud analysis that CI runs
# (.github/workflows/sonar.yml).

sonar.projectKey=inferstep_ATLAS
sonar.organization=inferstep
sonar.sourceEncoding=UTF-8

# The whole repository is analysed. A file is either code or test code:
# the patterns below name the test code, and the same patterns take it out
# of the code. Go tests sit next to the code they test; the Python and
# TypeScript tests have folders of their own. Images are not text and are
# left out.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,tests/**,services/geometric-lens/tests/**,clients/extensions/vscode/test/**
sonar.exclusions=**/*_test.go,tests/**,services/geometric-lens/tests/**,clients/extensions/vscode/test/**,**/*.png,**/*.gif,**/*.jpg,**/*.jpeg,**/*.ico,**/*.webp

# A Dockerfile that pins a base image by both tag and digest does so on
# purpose: the tag says which version it is, and the digest makes the build
# reproducible. Rule docker:S8431 asks for one of the two, so it does not apply.
sonar.issue.ignore.multicriteria=dockerPins,sandboxCommand,sandboxCwd
sonar.issue.ignore.multicriteria.dockerPins.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerPins.resourceKey=**/Dockerfile*

# The sandbox runs the caller's command by design. The trust model in the
# docstring of services/sandbox/executor_server.py tells why. Rule
# pythonsecurity:S6350 reports that a request gives the command to
# background_start. Rule pythonsecurity:S6549 reports that the cwd check in
# _resolve_bg_cwd tells which paths exist. The caller has the service token
# and can run any command in the container. Such a command can read any path
# that the cwd check could reveal. So the two rules do not apply to this file.
sonar.issue.ignore.multicriteria.sandboxCommand.ruleKey=pythonsecurity:S6350
sonar.issue.ignore.multicriteria.sandboxCommand.resourceKey=**/sandbox/executor_server.py
sonar.issue.ignore.multicriteria.sandboxCwd.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.sandboxCwd.resourceKey=**/sandbox/executor_server.py

# From the oldest Python the command-line tool supports to the newest one
# a service image runs on.
sonar.python.version=3.9,3.10,3.11,3.12,3.13

# Coverage is measured by the test jobs and shown by Codecov. Its reports
# are not given to this analysis, which would read that as no coverage at
# all, so coverage is left out of it.
sonar.coverage.exclusions=**/*
