openapi: 3.1.0
info:
  title: ATLAS Proxy API
  description: >
    HTTP + SSE surface of atlas-proxy (the agent control plane). Versioned
    by GET /version (api_version); breaking changes bump the major. Error
    responses use the stable error envelope (see error_envelope.schema.json)
    — clients switch on the `error` code, never the human `detail`.
  version: 1.0.0
servers:
  - url: http://localhost:8090
    description: Local proxy (loopback only by default)
paths:
  /version:
    get:
      summary: API + protocol version and the error-code set
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version: {type: string}
                  protocol_version: {type: integer}
                  error_codes: {type: array, items: {type: string}}
  /health:
    get:
      summary: >
        Liveness + counters (probes llama-server, geometric-lens /health and
        /ready, and the sandbox); always 200 — status reports ok/degraded;
        auth-exempt
      security: []
      responses:
        "200": {description: Proxy up}
  /ready:
    get:
      summary: >
        Readiness — 200 only when all four gates pass (llama-server /health,
        geometric-lens /ready, sandbox /health, v3-service /health);
        auth-exempt
      security: []
      responses:
        "200": {description: Ready}
        "503": {description: A dependency is not ready}
  /v1/models:
    get:
      summary: Forwarded model list from llama-server
      responses:
        "200": {description: Model list}
  /models:
    get:
      summary: Alias of /v1/models
      responses:
        "200": {description: Model list}
  /v1/agent:
    post:
      summary: Run one agent turn; streams SSE events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
                working_dir: {type: string}
                mode: {type: string, enum: [default, accept-edits, yolo]}
                session_id: {type: string}
                history:
                  type: array
                  description: Prior-turn messages replayed before the new one (most recent 40 kept)
                  items:
                    type: object
                    properties:
                      role: {type: string, enum: [user, assistant]}
                      content: {type: string}
                session_allowed_tools:
                  type: array
                  description: Tool names pre-approved for the session (skip the permission prompt)
                  items: {type: string}
                disable_fresh_slot: {type: boolean, description: Keep the pre-warmed KV-cache prefix instead of requesting a fresh slot}
                sandbox_subdir: {type: string, description: Confine the turn to a bare subdirectory name under the workspace}
      responses:
        "200":
          description: SSE stream of events (see sse_envelope.schema.json)
          content:
            text/event-stream: {schema: {type: string}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /events:
    get:
      summary: Global typed-envelope SSE feed
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: {schema: {type: string}}
  /cancel:
    post:
      summary: Abort the in-flight turn for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties: {session_id: {type: string}}
      responses:
        "200": {description: Cancelled}
        "404": {description: No in-flight turn for that session (idempotent repeat)}
  /v1/permission:
    post:
      summary: Answer a pending permission_request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, tool_call_id, decision]
              properties:
                session_id: {type: string}
                tool_call_id: {type: string}
                decision: {type: string, enum: [allow, deny]}
                scope: {type: string, enum: [once, session]}
      responses:
        "200": {description: Decision delivered}
        "404": {description: No matching pending request (already resolved, cancelled, or timed out)}
  /v1/calibration/status:
    get:
      summary: Lens/ASA status incl. the seven canonical dimensions
      responses:
        "200": {description: Calibration status}
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: >
        Per-installation service token (secrets/service-token). Required on
        all routes except /health, /ready, /version when a token is
        configured.
  responses:
    Unauthorized:
      description: Missing/invalid service token (error code `unauthorized`)
      content:
        application/json:
          schema: {$ref: "./error_envelope.schema.json"}
security:
  - serviceToken: []
