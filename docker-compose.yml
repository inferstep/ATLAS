services:
  # --- LLM Inference (CUDA + grammar support) ---
  # The image's ENTRYPOINT (inference/entrypoint-v3.1.sh) is what runs
  # llama-server. It does NOT consume "$@", so a compose `command:` here
  # would be silently ignored. Configure the server via the environment
  # variables the entrypoint actually reads:
  #   MODEL_PATH, PORT, CONTEXT_LENGTH, PARALLEL_SLOTS,
  #   KV_CACHE_TYPE_K, KV_CACHE_TYPE_V, SLOT_SAVE_PATH
  # `--embeddings` is set by the entrypoint (geometric-lens C(x)/G(x)
  # scoring depends on it). See ISSUES.md PC-017.
  llama-server:
    # Default behavior: pull prebuilt image from GHCR (PC-052). To rebuild
    # locally for dev, run: docker compose build llama-server
    # Tag is overridable via ATLAS_IMAGE_TAG (default: latest from main).
    image: ghcr.io/${ATLAS_GHCR_OWNER:-inferstep}/atlas-llama:${ATLAS_IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: ./inference
      dockerfile: Dockerfile.v31
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${ATLAS_MODELS_DIR:-./models}:/models:ro
      # Internal-auth token (read-only; absent dir => auth disabled).
      - ${ATLAS_SECRETS_DIR:-./secrets}:/run/atlas-secrets:ro
      # Volume-mount the entrypoint so we can iterate on llama-server
      # flags without rebuilding the 75-min CUDA image. The image still
      # bakes in the same script at /entrypoint.sh — this just shadows
      # it during dev. Production GHCR pulls work fine without this
      # mount (the COPY'd entrypoint stands on its own).
      - ./inference/entrypoint-v3.1.sh:/entrypoint.sh:ro
    ports:
      - "127.0.0.1:${ATLAS_LLAMA_PORT:-8080}:8080"
    # The model's budget, and why it is UNSET.
    #
    # It was the OOM victim precisely because it had no limit: unbounded and
    # largest is what the kernel's victim selection looks for. The obvious fix
    # is a cgroup limit, and the first draft of this file shipped one at 9.5
    # GiB. Measuring the deployed server showed that value is below what it
    # already uses: process peak RSS 10.31 GiB, anonymous working set 8.81 GiB
    # once the 2.1 GiB it has swapped is counted back, and only 16 MiB of
    # reclaimable page cache to give back under pressure. A hard limit under
    # the peak does not produce reclaim, it produces a certain kill of the one
    # process everything else depends on -- trading a rare host-pressure event
    # for a reliable outage.
    #
    # So it stays unenforced until a real-model canary establishes a value with
    # measured headroom. `0` is docker's own spelling of "no limit", which is
    # the state this service is in today; ATLAS_LLAMA_BUDGET_BYTES carries the
    # measured expectation for the envelope arithmetic instead. Setting
    # ATLAS_LLAMA_MEM enforces whatever you put in it; do that only with canary
    # evidence, and never below the observed peak.
    mem_limit: ${ATLAS_LLAMA_MEM:-0}
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - atlas
    environment:
      - MODEL_PATH=/models/${ATLAS_MODEL_FILE:?Set ATLAS_MODEL_FILE in .env or run atlas init}
      - ATLAS_MODEL_NAME=${ATLAS_MODEL_NAME:?Set ATLAS_MODEL_NAME in .env or run atlas init}
      - PORT=8080
      # Context length is TOTAL across all slots. llama-server divides it
      # by PARALLEL_SLOTS for per-slot n_ctx_seq. The compose default of
      # 131072 / 4 slots = 32k per slot matches ATLAS's pre-/demo
      # behavior; the entrypoint comments confirm --parallel 4 at 40k
      # per slot fits within budget on a 16 GB card.
      - CONTEXT_LENGTH=${ATLAS_CTX_SIZE:-131072}
      # Embedding pooling for the Geometric Lens (`--pooling`). `none`
      # returns per-token vectors, which the per-step C(x)/G(x) path
      # requires; the whole-text path pools and L2-normalizes them
      # client-side, so it reads the same vector it would under `mean`.
      # `--pooling` is server-global in llama.cpp, so one mode has to
      # serve both consumers and only `none` carries enough information.
      - ATLAS_EMBED_POOLING=${ATLAS_EMBED_POOLING:-none}
      # Canonical ATLAS_* names take precedence; the nested legacy fallback
      # keeps .env files generated before the rename working during upgrade.
      - PARALLEL_SLOTS=${ATLAS_PARALLEL_SLOTS:-${PARALLEL_SLOTS:-4}}
      # Model-aware runtime sizing (PC-208). `atlas tier fit --write`
      # derives these from the GGUF header + GPU VRAM; the defaults
      # match a 16 GB card. The entrypoint runs with --fit off, so a
      # config that doesn't fit fails fast instead of spilling to CPU.
      - KV_CACHE_TYPE_K=${ATLAS_KV_TYPE_K:-${KV_CACHE_TYPE_K:-f16}}
      - KV_CACHE_TYPE_V=${ATLAS_KV_TYPE_V:-${KV_CACHE_TYPE_V:-f16}}
      - UBATCH_SIZE=${ATLAS_UBATCH:-1024}
      - BATCH_SIZE=${ATLAS_BATCH:-1024}
      # GPU selection on multi-GPU hosts. The entrypoint maps this to
      # CUDA_VISIBLE_DEVICES (or the HIP/Vulkan equivalent) and skips
      # the export when empty, so the default is "all GPUs visible".
      - ATLAS_GPU_INDEX=${ATLAS_GPU_INDEX:-}
      # ASA control-vector knobs (read by entrypoint-v3.1.sh; without the
      # passthrough the documented .env knobs only work on the macOS
      # native launcher). Empty values keep the entrypoint defaults.
      - ATLAS_CONTROL_VECTOR=${ATLAS_CONTROL_VECTOR:-}
      - ATLAS_CONTROL_VECTOR_SCALE=${ATLAS_CONTROL_VECTOR_SCALE:-}
      - ATLAS_CONTROL_VECTOR_LAYER_RANGE=${ATLAS_CONTROL_VECTOR_LAYER_RANGE:-}
      - ATLAS_CONTROL_VECTOR_ALLOW_UNVERIFIED=${ATLAS_CONTROL_VECTOR_ALLOW_UNVERIFIED:-}
      - ATLAS_SERVICE_TOKEN_FILE=/run/atlas-secrets/service-token

  # --- Geometric Lens (C(x)/G(x) scoring) ---
  geometric-lens:
    # host.docker.internal is a Docker Desktop convenience and does NOT
    # resolve on stock Linux Docker, so the documented "point ATLAS at a
    # host-native llama-server" recipe silently failed there and users had to
    # reverse-engineer the docker0 gateway (172.17.0.1). host-gateway makes
    # the same hostname work on Linux, so one override serves every platform
    # (GH #146). Harmless when the bundled llama-server is in use.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ghcr.io/${ATLAS_GHCR_OWNER:-inferstep}/atlas-lens:${ATLAS_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Part of the memory envelope; measured peak 1.56 GiB.
    mem_limit: ${ATLAS_LENS_MEM:-1792m}
    build:
      context: ./geometric-lens
    environment:
      - LLAMA_URL=http://llama-server:8080
      - LLAMA_EMBED_URL=http://llama-server:8080
      # The /embedding physical batch llama-server runs with (its `-ub`,
      # UBATCH_SIZE above): the longest input one Lens score can be computed
      # from. Declared here so /health reports it before any request is
      # refused; the lens replaces it with the value the server states on a
      # refusal. Information only, scoring is never gated on it: a longer
      # input is reported unscored, never truncated or split.
      - LLAMA_EMBED_CAPACITY_TOKENS=${ATLAS_UBATCH:-1024}
      - ATLAS_MODEL_NAME=${ATLAS_MODEL_NAME:?Set ATLAS_MODEL_NAME in .env or run atlas init}
      - ATLAS_LOG_FORMAT=${ATLAS_LOG_FORMAT:-}
      - ATLAS_SERVICE_TOKEN_FILE=/run/atlas-secrets/service-token
    volumes:
      - ${ATLAS_LENS_MODELS:-./geometric-lens/geometric_lens/models}:/app/geometric_lens/models:ro
      - ${ATLAS_SECRETS_DIR:-./secrets}:/run/atlas-secrets:ro
    ports:
      - "127.0.0.1:${ATLAS_LENS_PORT:-8099}:8099"
    depends_on:
      llama-server:
        condition: service_healthy
    healthcheck:
      # Deliberately /health, NOT /ready — do not "fix" this.
      #
      # /health is liveness: is the process up and serving? It returns 200
      # whenever that is true (its own docstring says so). /ready is
      # readiness: is C(x)/G(x) scoring actually functional? Those are
      # different questions and Docker wants the first one.
      #
      # Pointing this at /ready deadlocks a fresh install: v3-service and
      # atlas-proxy both `depends_on: geometric-lens: service_healthy`, and
      # /ready returns 503 until the lens artifacts exist ("run atlas lens
      # build") — so nothing would ever start on a new machine. Docker also
      # restarts unhealthy containers, and restarting cannot conjure missing
      # weights; it would just restart-loop.
      #
      # The readiness question IS gated, in the right place: the proxy asks
      # whether the lens can score before every request and refuses it, with
      # the reason, when it cannot (proxy/lens_required.go; ADR 0011). Its
      # /ready reports the same answer. The stack stays up, so `atlas doctor`
      # and `atlas lens build` can still run.
      test: ["CMD", "curl", "-sf", "http://localhost:8099/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - atlas
      - sandbox-net

  # --- V3 Pipeline Service ---
  v3-service:
    # host.docker.internal is a Docker Desktop convenience and does NOT
    # resolve on stock Linux Docker, so the documented "point ATLAS at a
    # host-native llama-server" recipe silently failed there and users had to
    # reverse-engineer the docker0 gateway (172.17.0.1). host-gateway makes
    # the same hostname work on Linux, so one override serves every platform
    # (GH #146). Harmless when the bundled llama-server is in use.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ghcr.io/${ATLAS_GHCR_OWNER:-inferstep}/atlas-v3:${ATLAS_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Part of the memory envelope; measured peak 52 MiB: it orchestrates, the executor runs.
    mem_limit: ${ATLAS_V3_MEM:-512m}
    build:
      context: .
      dockerfile: v3-service/Dockerfile
    environment:
      - ATLAS_INFERENCE_URL=http://llama-server:8080
      - ATLAS_LENS_URL=http://geometric-lens:8099
      - ATLAS_SANDBOX_URL=http://sandbox:8020
      - ATLAS_MODEL_NAME=${ATLAS_MODEL_NAME:?Set ATLAS_MODEL_NAME in .env or run atlas init}
      - ATLAS_LOG_FORMAT=${ATLAS_LOG_FORMAT:-}
      # Plan-generation thinking mode (read inside this process — must be
      # forwarded here or setting it in .env has no effect).
      - ATLAS_PLAN_THINKING=${ATLAS_PLAN_THINKING:-}
      # Stage telemetry (telemetry/*.jsonl + per-task pipeline summary)
      # for the live pipeline, persisted on the v3-telemetry volume.
      # Container-side path; set 0/off in .env to disable. Fail-soft:
      # an unwritable dir disables telemetry, never generation.
      - ATLAS_V3_TELEMETRY_DIR=${ATLAS_V3_TELEMETRY_DIR:-/data/telemetry}
      # Same wall-clock cap the proxy's V3 bridge enforces (seconds,
      # default 180, 0 disables). The service reads it for the
      # refinement budget gate, so both sides must see one value.
      - ATLAS_V3_TIMEOUT=${ATLAS_V3_TIMEOUT:-}
      - ATLAS_SERVICE_TOKEN_FILE=/run/atlas-secrets/service-token
    volumes:
      - ${ATLAS_SECRETS_DIR:-./secrets}:/run/atlas-secrets:ro
      - v3-telemetry:/data/telemetry
    ports:
      - "127.0.0.1:${ATLAS_V3_PORT:-8070}:8070"
    depends_on:
      llama-server:
        condition: service_healthy
      geometric-lens:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8070/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - atlas
      - sandbox-net

  # --- Sandbox (isolated code execution) ---
  sandbox:
    # host.docker.internal is a Docker Desktop convenience and does NOT
    # resolve on stock Linux Docker, so the documented "point ATLAS at a
    # host-native llama-server" recipe silently failed there and users had to
    # reverse-engineer the docker0 gateway (172.17.0.1). host-gateway makes
    # the same hostname work on Linux, so one override serves every platform
    # (GH #146). Harmless when the bundled llama-server is in use.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ghcr.io/${ATLAS_GHCR_OWNER:-inferstep}/atlas-sandbox:${ATLAS_IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: ./sandbox
    environment:
      # Per-call execution ceiling inside the executor (executor_server.py
      # clamps request timeouts to MAX_EXECUTION_TIME). Default matches the
      # proxy's 300s run_command cap so long builds/tests aren't cut off
      # by the executor's internal 60s default.
      - MAX_EXECUTION_TIME=${ATLAS_SANDBOX_MAX_EXECUTION_TIME:-300}
      # The rest of the per-command contract, validated by the executor at
      # startup. Each is a hard maximum a request may narrow and never raise.
      # The memory ceiling sits BELOW the container's mem_limit because the
      # executor process and the output it buffers share that container with
      # the command: one command may not consume the whole allocation.
      - ATLAS_EXEC_MEMORY_BYTES=${ATLAS_EXEC_MEMORY_BYTES:-1073741824}
      - ATLAS_EXEC_MAX_PROCESSES=${ATLAS_EXEC_MAX_PROCESSES:-256}
      - ATLAS_EXEC_OUTPUT_BYTES=${ATLAS_EXEC_OUTPUT_BYTES:-33554432}
      - ATLAS_LOG_FORMAT=${ATLAS_LOG_FORMAT:-}
      # Workspace-snapshot caps for overlay-file runs (executor_server.py
      # reads these; without the passthrough the documented .env knobs
      # would be silently ignored in container deployments).
      - ATLAS_SHELL_SNAPSHOT_MAX_FILES=${ATLAS_SHELL_SNAPSHOT_MAX_FILES:-20000}
      - ATLAS_SHELL_SNAPSHOT_MAX_BYTES=${ATLAS_SHELL_SNAPSHOT_MAX_BYTES:-268435456}
      - ATLAS_SHELL_SNAPSHOT_MAX_FILE_BYTES=${ATLAS_SHELL_SNAPSHOT_MAX_FILE_BYTES:-16777216}
      # Non-root runtime: the uid may be overridden below to match the
      # host user, and an overridden uid has no passwd entry — HOME and
      # the toolchain write-roots must come from the environment.
      - HOME=/home/sandbox
      - CARGO_HOME=/home/sandbox/.cargo
      - GOPATH=/home/sandbox/go
      # `go run` links the program into GOTMPDIR and then executes it,
      # and every tmpfs below is noexec, so the default (/tmp) makes
      # `go run x.go` fail with "fork/exec ...: permission denied" on
      # every invocation. Measured across four benchmark runs: 22
      # permission-denied results, all of them Go. Points at the one
      # tmpfs that allows exec.
      - GOTMPDIR=/home/sandbox/gobuild
      - ATLAS_SERVICE_TOKEN_FILE=/run/atlas-secrets/service-token
    # Writable mounts for language toolchains. The container fs is
    # read_only=true for hardening, so every install/cache target a
    # toolchain wants to write to needs an explicit tmpfs. One per
    # language ecosystem; sized for "ephemeral, not a cache" — wiped
    # on every container restart. The pattern is *universal* (PC-191):
    # adding support for a new language is one line here, not a code
    # change. /workspace is bind-mounted writable, so per-project
    # install targets like node_modules/, target/, vendor/ work
    # against the user's lockfile without any of these tmpfs at all.
    # The Python trio (/tmp, .local, .cache) is env-tunable: a single
    # `pip install pandas pyarrow` unpacks >256M into .local and builds
    # in /tmp, so the old fixed 256M/1G caps died with "No space left on
    # device" (TB2 bench 2026-07-18). tmpfs size is a ceiling, not a
    # reservation — raising it costs nothing until bytes are written,
    # and written bytes count against mem_limit, which stays the real
    # backstop.
    tmpfs:
      - /tmp:size=${ATLAS_SANDBOX_TMP_SIZE:-2G}    # /tmp itself (pip download/build dir, mktemp targets, /tmp/sandbox lives inside)
      - /home/sandbox:size=128M      # dotfiles + misc config the toolchains scatter
      - /home/sandbox/.local:size=${ATLAS_SANDBOX_PIP_SIZE:-1G}   # Python: pip install --user (pandas+pyarrow+numpy alone ~400M)
      - /home/sandbox/.cache:size=${ATLAS_SANDBOX_CACHE_SIZE:-512M}   # generic cache root (pip wheel cache, ruff, mypy)
      - /home/sandbox/.npm:size=256M     # Node: npm cache
      - /home/sandbox/.cargo:size=512M   # Rust: crate downloads (CARGO_HOME; toolchain stays read-only in /opt)
      - /home/sandbox/go:size=512M       # Go: module cache + bin (GOPATH)
      # The one writable path that permits exec, for compiled languages
      # that link a binary outside the project and run it. Scoped
      # deliberately: /tmp stays noexec. This grants no capability the
      # sandbox lacked, since the bind-mounted /workspace already
      # permits exec, so `go build -o ./prog && ./prog` always worked;
      # it makes the toolchain's own default path work too.
      - /home/sandbox/gobuild:size=512M,exec  # Go: `go run` link+exec dir (GOTMPDIR)
      - /home/sandbox/.m2:size=512M      # Java: Maven local repo
      - /home/sandbox/.gradle:size=512M  # Java/Kotlin: Gradle caches
      - /home/sandbox/.bundle:size=256M  # Ruby: bundler --path
      - /home/sandbox/.gem:size=256M     # Ruby: gem install --user-install
      - /home/sandbox/.composer:size=256M # PHP: composer global
      - /home/sandbox/.nuget:size=256M   # .NET: NuGet packages
      - /home/sandbox/.pub-cache:size=256M # Dart: pub packages
    # The container fs stays read-only (hardening). The user's project
    # is bind-mounted at /workspace — same path the proxy sees — so the
    # /shell endpoint can run pip install, python app.py, etc. against
    # the actual files the agent edited. Without this, run_command
    # hits "command not found" in the proxy container (proxy has no
    # python) and verify-step plans never complete. See PC-188.
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Non-root + zero capabilities. The uid/gid default to 1000 and are
    # overridden by `atlas init` to match the host user, so /workspace
    # writes keep the right owner without CAP_DAC_OVERRIDE (which is why
    # cap_drop ALL is safe — nothing in the executor needs a capability).
    user: "${ATLAS_SANDBOX_UID:-1000}:${ATLAS_SANDBOX_GID:-1000}"
    cap_drop:
      - ALL
    # Resource caps. run_command runs untrusted model-authored shell in
    # here, so the container — not a regex — is the real backstop against
    # resource exhaustion. pids_limit is a hard fork-bomb stop at the
    # kernel level (1024 is far above any normal build, far below a bomb).
    # mem_limit and cpus have CONSERVATIVE non-zero defaults so a raw
    # `docker compose up` (no wizard) is never unlimited — a runaway can't
    # OOM or peg the host out of the box. `atlas init` detects host RAM/
    # cores and writes host-appropriate ATLAS_SANDBOX_MEM (~75% RAM) /
    # ATLAS_SANDBOX_CPUS (~75% cores) to .env, which override these floors.
    #
    # THE MEMORY ENVELOPE.
    #
    # These numbers are not independent. A staged verification command reached
    # 5.9 GB in seconds on a 16 GB host where the inference server held 9 GB
    # with no limit of its own; every process was inside its own bounds and the
    # kernel still had to pick something to kill, so it took the model. What
    # was missing was not one limit, it was a SUM that fits the machine.
    #
    # The default below assumes a 16 GiB host running a 12B Q4 model. On that
    # machine the model's steady resident set is the dominant term and the
    # sandbox gets what is left, which is not much: 1.5 GiB, holding one
    # command at 1 GiB plus the executor and the output it buffers. `atlas
    # init` sizes these from the real host; ATLAS_HOST_MEMORY_BYTES turns the
    # arithmetic into a startup check rather than a comment, and the proxy
    # refuses to run commands when the declared sum does not fit.
    pids_limit: ${ATLAS_SANDBOX_PIDS:-1024}
    mem_limit: ${ATLAS_SANDBOX_MEM:-1536m}
    memswap_limit: ${ATLAS_SANDBOX_MEM:-1536m}   # no swap: a swapping test is a hung one
    cpus: ${ATLAS_SANDBOX_CPUS:-2}
    # Don't override working_dir — the image uses WORKDIR=/app for
    # executor_server.py. The /shell endpoint defaults its cwd to
    # /workspace at request time, which is the bind-mounted user
    # project — that's where commands actually run.
    volumes:
      - ${ATLAS_PROJECT_DIR:-.}:/workspace
      - ${ATLAS_SECRETS_DIR:-./secrets}:/run/atlas-secrets:ro
    ports:
      - "127.0.0.1:${ATLAS_SANDBOX_PORT:-30820}:8020"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    # The sandbox lives on its own network so egress can be cut without
    # touching the rest of the stack: ATLAS_SANDBOX_NET_INTERNAL=true
    # makes sandbox-net internal (no default route — executed code loses
    # all egress; service-to-service HTTP from proxy/v3/lens still
    # works). Caveats of internal mode: the 127.0.0.1:30820 host publish
    # above goes dead (atlas doctor probes the sandbox via docker exec
    # fallback), and pip/npm installs inside verification runs will fail
    # by design. Default false = unrestricted egress (documented).
    networks:
      - sandbox-net

  # --- ATLAS Proxy (agent loop + grammar + structured tool calls) ---
  # The proxy needs access to your project files for read_file, write_file, etc.
  #
  # File-write target inside the container is /workspace, pinned via
  # ATLAS_WORKSPACE_DIR below. The host directory mounted to /workspace is
  # ATLAS_PROJECT_DIR (defaults to the directory you ran `docker compose up`
  # from). To target a different host project, set ATLAS_PROJECT_DIR in .env
  # (or `ATLAS_PROJECT_DIR=/path/to/proj docker compose up`) BEFORE bringing
  # the stack up — the bind mount is fixed for the container's lifetime.
  atlas-proxy:
    # host.docker.internal is a Docker Desktop convenience and does NOT
    # resolve on stock Linux Docker, so the documented "point ATLAS at a
    # host-native llama-server" recipe silently failed there and users had to
    # reverse-engineer the docker0 gateway (172.17.0.1). host-gateway makes
    # the same hostname work on Linux, so one override serves every platform
    # (GH #146). Harmless when the bundled llama-server is in use.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ghcr.io/${ATLAS_GHCR_OWNER:-inferstep}/atlas-proxy:${ATLAS_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Part of the memory envelope; measured peak 33 MiB.
    mem_limit: ${ATLAS_PROXY_MEM:-256m}
    # Must exceed the proxy's own shutdown budget (ATLAS_SHUTDOWN_GRACE_SEC,
    # default 650s): session total 600s of request drain plus a 10s close-hook
    # margin is 610s, and the proxy refuses to start if that does not fit. The
    # extra 40s is headroom between the process finishing and Docker killing it.
    stop_grace_period: 650s
    build:
      context: ./proxy
    # Run as the invoking user (same rationale as the sandbox's
    # ATLAS_SANDBOX_UID): the proxy writes to the /workspace host bind mount
    # (write_file/edit_file targets). The image's baked-in non-root user
    # (uid 1001) can't write host dirs owned by the operator, which fails
    # every file write with `permission denied` on the .atlas.tmp temp file.
    # `atlas init` writes the invoking user's ids into .env.
    user: "${ATLAS_PROXY_UID:-1000}:${ATLAS_PROXY_GID:-1000}"
    environment:
      # THE DECLARED MEMORY ENVELOPE. Absent ATLAS_HOST_MEMORY_BYTES nothing
      # is declared and nothing is checked -- an envelope this build guessed
      # at would be asserting something the operator never said. When it IS
      # declared, the proxy adds every hard maximum below plus the host
      # reserve and refuses to run commands if the sum does not fit, because a
      # deployment that can over-commit is one where every process is inside
      # its own limit at the moment the kernel picks a victim.
      - ATLAS_HOST_MEMORY_BYTES=${ATLAS_HOST_MEMORY_BYTES:-}
      - ATLAS_HOST_RESERVE_BYTES=${ATLAS_HOST_RESERVE_BYTES:-1610612736}
      # Unset by default: the enforced limit. See the inference service above.
      - ATLAS_LLAMA_MEM=${ATLAS_LLAMA_MEM:-}
      # The measured expectation, used for accounting only. Above the deployed
      # server's observed peak resident set of 10.31 GiB.
      - ATLAS_LLAMA_BUDGET_BYTES=${ATLAS_LLAMA_BUDGET_BYTES:-11811160064}
      - ATLAS_LENS_MEM=${ATLAS_LENS_MEM:-1792m}
      - ATLAS_V3_MEM=${ATLAS_V3_MEM:-512m}
      - ATLAS_PROXY_MEM=${ATLAS_PROXY_MEM:-256m}
      - ATLAS_SANDBOX_MEM=${ATLAS_SANDBOX_MEM:-1536m}
      - ATLAS_EXEC_MEMORY_BYTES=${ATLAS_EXEC_MEMORY_BYTES:-1073741824}
      - ATLAS_EXEC_CONCURRENCY=${ATLAS_EXEC_CONCURRENCY:-1}
      - ATLAS_GRAMMAR_MODE=${ATLAS_GRAMMAR_MODE:-strict}
      - ATLAS_PROXY_PORT=8090
      - ATLAS_INFERENCE_URL=http://llama-server:8080
      - ATLAS_LLAMA_URL=http://llama-server:8080
      - ATLAS_LENS_URL=http://geometric-lens:8099
      - ATLAS_SANDBOX_URL=http://sandbox:8020
      - ATLAS_V3_URL=http://v3-service:8070
      - ATLAS_MODEL_NAME=${ATLAS_MODEL_NAME:?Set ATLAS_MODEL_NAME in .env or run atlas init}
      # Security + observability knobs read in-container; without these
      # passthroughs a .env setting silently does nothing (doc-audit fix).
      - ATLAS_TRUST_MODE=${ATLAS_TRUST_MODE:-}
      - ATLAS_LOG_FORMAT=${ATLAS_LOG_FORMAT:-}
      - ATLAS_ALLOW_CREDENTIAL_READS=${ATLAS_ALLOW_CREDENTIAL_READS:-}
      - ATLAS_PERMISSION_TIMEOUT_SEC=${ATLAS_PERMISSION_TIMEOUT_SEC:-}
      - ATLAS_REASONING_BUDGET=${ATLAS_REASONING_BUDGET:-}
      # Fenced-content sub-call watchdog (seconds to first CONTENT token).
      # Default 60 in code; a large agent context + a reasoning preamble on a
      # slower/contended GPU can exceed that before the file starts, cancelling
      # a generation that would have produced it. Raise per deployment.
      - ATLAS_FENCED_FIRST_CONTENT_SEC=${ATLAS_FENCED_FIRST_CONTENT_SEC:-}
      - ATLAS_FENCED_IDLE_SEC=${ATLAS_FENCED_IDLE_SEC:-}
      - ATLAS_FENCED_STALL_SEC=${ATLAS_FENCED_STALL_SEC:-}
      # Repetition-control sampling. llama-server defaults every one of
      # these off, so the proxy sets DRY on outgoing requests; these let
      # a .env override reach the container. Empty means the in-code
      # default applies.
      - ATLAS_DRY_MULTIPLIER=${ATLAS_DRY_MULTIPLIER:-}
      - ATLAS_DRY_BASE=${ATLAS_DRY_BASE:-}
      - ATLAS_DRY_ALLOWED_LENGTH=${ATLAS_DRY_ALLOWED_LENGTH:-}
      - ATLAS_DRY_PENALTY_LAST_N=${ATLAS_DRY_PENALTY_LAST_N:-}
      - ATLAS_REPEAT_PENALTY=${ATLAS_REPEAT_PENALTY:-}
      - ATLAS_REPEAT_LAST_N=${ATLAS_REPEAT_LAST_N:-}
      # Greedy decoding for the agent loop, and restating the last-read file
      # at the generation point. Both target verbatim reproduction; set to 0
      # to fall back to the server's sampler chain / drop the restatement.
      - ATLAS_TRANSCRIPTION_SAMPLER=${ATLAS_TRANSCRIPTION_SAMPLER:-}
      - ATLAS_RESTATE_LAST_READ=${ATLAS_RESTATE_LAST_READ:-}
      # Context budget for conversation trimming (PC-216). Same
      # values the llama-server gets; the proxy trims history to a
      # token budget derived from per-slot context instead of a
      # blind message count, so a just-read file isn't dropped.
      - ATLAS_CTX_SIZE=${ATLAS_CTX_SIZE:-131072}
      - ATLAS_PARALLEL_SLOTS=${ATLAS_PARALLEL_SLOTS:-${PARALLEL_SLOTS:-4}}
      # Redundant-read short-circuit: when "1" (default), a re-read of an
      # unchanged file already in context returns a compact pointer instead
      # of re-injecting the file. Set "0" to always serve the full re-read
      # (useful for weak models that lean on re-reads as extra reasoning
      # passes).
      - ATLAS_DEDUP_READS=${ATLAS_DEDUP_READS:-1}
      # PC-192: opt-in host execution for run_command. Set to "host"
      # to bypass the sandbox container and run verifications on the
      # host (works when proxy runs locally, not in Docker — Docker
      # proxy can only see its own container fs). Per-project override
      # via /workspace/.atlas/config.toml [execution] target=host.
      - ATLAS_VERIFY_IN=${ATLAS_VERIFY_IN:-sandbox}
      # PC-200: turn cap override. Tier defaults: T0=5, T1-T3 uncapped
      # (the error-loop breaker and done-gates bound runaway turns). Set
      # a positive int to cap every tier. Useful for "fix the entire app"
      # prompts that legitimately need more turns.
      - ATLAS_MAX_TURNS=${ATLAS_MAX_TURNS:-}
      # Documented tuning knobs (docs/CONFIGURATION.md). Empty passthrough =
      # the in-code default applies; setting the key in .env reaches the
      # container without a compose edit.
      # V3 bridge call timeout in seconds (0 disables the cap).
      - ATLAS_V3_TIMEOUT=${ATLAS_V3_TIMEOUT:-}
      # Per-turn generation ceiling (tokens).
      - ATLAS_MAX_TOKENS=${ATLAS_MAX_TOKENS:-}
      # Ceiling forced onto passthrough generation requests without an
      # explicit (bounded) max_tokens/n_predict.
      - ATLAS_MAX_COMPLETION_TOKENS=${ATLAS_MAX_COMPLETION_TOKENS:-}
      # Conversation-history token budget override.
      - ATLAS_AGENT_HISTORY_BUDGET=${ATLAS_AGENT_HISTORY_BUDGET:-}
      # Set 0 to disable the 45s llama-server keep-warm ping (PC-035).
      - ATLAS_KEEP_LLAMA_WARM=${ATLAS_KEEP_LLAMA_WARM:-}
      # Set 0 to reuse KV slots across sessions instead of erasing (PC-045).
      - ATLAS_FRESH_SLOT_PER_SESSION=${ATLAS_FRESH_SLOT_PER_SESSION:-}
      # Pins the proxy's "where to write files" target. Must match the
      # working_dir below and the right-hand side of the volume mount.
      - ATLAS_WORKSPACE_DIR=/workspace
      - ATLAS_SERVICE_TOKEN_FILE=/run/atlas-secrets/service-token
    volumes:
      - ${ATLAS_MODELS_DIR:-./models}:/models:ro
      - ${ATLAS_PROJECT_DIR:-.}:/workspace
      # Internal-auth token (read-only; absent dir => auth disabled).
      - ${ATLAS_SECRETS_DIR:-./secrets}:/run/atlas-secrets:ro
      # Private diagnostic captures (ATLAS_SHADOW_CAPTURE, default OFF — see
      # docs/OPERATIONS.md). Its own host dir, deliberately not the V3
      # telemetry volume: that is service telemetry, and a diagnostic
      # acquisition must be separable from it.
      # Bind-mounted rather than a named volume so the directory carries the
      # invoking user's ownership — the proxy already runs as that user for the
      # workspace mount, and a named volume would be created
      # root-owned and unwritable to it. Nothing is written here unless
      # ATLAS_SHADOW_CAPTURE names a file.
      - ${ATLAS_DIAGNOSTIC_HOST_DIR:-./diagnostics}:/data/diagnostics
    working_dir: /workspace
    ports:
      - "127.0.0.1:${ATLAS_PROXY_PORT:-8090}:8090"
    depends_on:
      llama-server:
        condition: service_healthy
      geometric-lens:
        condition: service_healthy
      v3-service:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas
      - sandbox-net

volumes:
  v3-telemetry:

networks:
  atlas:
    driver: bridge
  # Dedicated sandbox network so egress can be cut independently:
  # internal:true removes the default route (executed code loses all
  # egress) while service-to-service HTTP on this network keeps working.
  sandbox-net:
    driver: bridge
    internal: ${ATLAS_SANDBOX_NET_INTERNAL:-false}
