<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!--
    The inferstep mark. VS Code does not use this file as a picture: it applies
    it as a CSS mask sized to the Activity Bar icon and fills it with the theme
    foreground (paneCompositeBar.ts), so the shapes only have to be opaque and
    the fill below is the mark's own colour, kept for anyone opening the file.

    The geometry is the vector source from #35 in its own 100 x 100 box, where
    the mark runs from x 22.8 to 77.85 and y 14 to 85.88. It is scaled to 20 px
    high, which keeps the proportions of the mark, and centred in the canvas.
  -->
  <g transform="translate(-2.002 -1.895) scale(0.27824)" fill="#121212">
    <rect x="50" y="35.85" width="12.90" height="8.60" rx="4.3"/>
    <rect x="41.2" y="49.77" width="21.70" height="8.60" rx="4.3"/>
    <rect x="31.7" y="63.7" width="31.20" height="8.60" rx="4.3"/>
    <rect x="22.8" y="77.28" width="40.10" height="8.60" rx="4.3"/>
    <rect x="65.6" y="34.4" width="11.60" height="51.60" rx="0.8"/>
    <circle cx="71.4" cy="20.45" r="6.45"/>
  </g>
</svg>
