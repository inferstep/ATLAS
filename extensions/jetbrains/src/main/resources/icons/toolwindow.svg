<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13">
  <!--
    The inferstep mark for the ATLAS tool window button, on a light theme: the
    four steps and the "i" with its dot, in #121212. 13 x 13 is the size the
    platform draws a tool window stripe button at, and the platform derives this
    file's dark counterpart from the name (_dark), so both are referenced by
    plugin.xml's one `icon` attribute.

    The geometry is the vector source from #35 in its own 100 x 100 box, where
    the mark runs from x 22.8 to 77.85 and y 14 to 86 (the dot's top to the
    stem's bottom). It is scaled to 12 px
    high, which keeps the proportions of the mark, and centred in 13 x 13: the
    mark lands at x 1.91-11.09 and y 0.50-12.50.
  -->
  <g transform="translate(-1.888 -1.833) scale(0.166667)" fill="#121212">
    <rect x="50" y="35.85" width="12.90" height="8.60" rx="4.3"/>
    <rect x="41.2" y="49.77" width="21.70" height="8.60" rx="4.3"/>
    <rect x="31.7" y="63.7" width="31.20" height="8.60" rx="4.3"/>
    <rect x="22.8" y="77.28" width="40.10" height="8.60" rx="4.3"/>
    <rect x="65.6" y="34.4" width="11.60" height="51.60" rx="0.8"/>
    <circle cx="71.4" cy="20.45" r="6.45"/>
  </g>
</svg>
