<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!--
    The inferstep mark for a light theme: the four steps and the "i" with its
    dot, in #121212 on the transparent canvas the IDE draws it on. The platform
    reads this file and pluginIcon_dark.svg by name from META-INF; nothing in
    plugin.xml references either.

    The geometry is the vector source from #35 in its own 100 x 100 box, where
    the mark runs from x 22.8 to 77.85 and y 14 to 85.88. It is scaled to 32 px
    high, which keeps the proportions of the mark, and centred in 40 x 40.
  -->
  <g transform="translate(-2.404 -2.233) scale(0.44519)" fill="#121212">
    <rect x="50" y="35.85" width="12.90" height="8.60" rx="4.3"/>
    <rect x="41.2" y="49.77" width="21.70" height="8.60" rx="4.3"/>
    <rect x="31.7" y="63.7" width="31.20" height="8.60" rx="4.3"/>
    <rect x="22.8" y="77.28" width="40.10" height="8.60" rx="4.3"/>
    <rect x="65.6" y="34.4" width="11.60" height="51.60" rx="0.8"/>
    <circle cx="71.4" cy="20.45" r="6.45"/>
  </g>
</svg>
