<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13">
  <!--
    The inferstep mark for the ATLAS tool window button, on a dark theme. Same
    geometry and scale as toolwindow.svg, in #f7f7f4 so it reads on a dark
    stripe. The platform picks this file by its `_dark` suffix; plugin.xml names
    only toolwindow.svg.
  -->
  <g transform="translate(-1.888 -1.833) scale(0.166667)" fill="#f7f7f4">
    <rect x="50" y="35.85" width="12.90" height="8.60" rx="4.3"/>
    <rect x="41.2" y="49.77" width="21.70" height="8.60" rx="4.3"/>
    <rect x="31.7" y="63.7" width="31.20" height="8.60" rx="4.3"/>
    <rect x="22.8" y="77.28" width="40.10" height="8.60" rx="4.3"/>
    <rect x="65.6" y="34.4" width="11.60" height="51.60" rx="0.8"/>
    <circle cx="71.4" cy="20.45" r="6.45"/>
  </g>
</svg>
