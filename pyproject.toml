[project]
name = "atlas"
version = "3.1.6"
description = "Adaptive Test-time Learning and Autonomous Specialization"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9"
authors = [{name = "Isaac Tigges"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
# The core CLI is deliberately stdlib-only (every third-party import in
# atlas/ is lazy/function-level), so there are no base dependencies.

[project.optional-dependencies]
# `atlas lens build` / `atlas asa build` (per-model artifact training)
# hard-require these at runtime — including xgboost + scikit-learn for
# the G(x) training step. Lower bounds only — the CLI has no reason to
# pin exact versions.
train = [
    # A lower bound that default PyPI can satisfy: plain `pip install
    # atlas[train]` never consults the pytorch CPU index (a >=2.13.0 floor
    # was once unsatisfiable there). The lens image pins its own torch in
    # geometric-lens/requirements.txt; keep this floor at or below it.
    "torch>=2.12",
    "numpy>=1.24",
    "gguf",
    "huggingface_hub",
    "psutil",
    "xgboost>=3.2.0",
    "scikit-learn>=1.7.2",
]

[project.urls]
Homepage = "https://github.com/inferstep/ATLAS"
Repository = "https://github.com/inferstep/ATLAS"
Issues = "https://github.com/inferstep/ATLAS/issues"
Changelog = "https://github.com/inferstep/ATLAS/blob/main/CHANGELOG.md"

[project.scripts]
atlas = "atlas.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"

[tool.coverage.run]
# The Python code the suites are measured against. A file no test imports
# still counts, at 0%. Paths are stored relative to the repo root, so a
# report reads the same on any machine.
source = ["atlas", "v3-service", "geometric-lens", "sandbox", "scripts"]
omit = ["geometric-lens/tests/*"]
relative_files = true

[build-system]
# >=77 because the SPDX-string `license` form (PEP 639) fails the build
# on older setuptools ("license should be a table").
requires = ["setuptools>=77"]  # floor stays py3.9-compatible: RHEL9-family hosts (bootstrap) run python 3.9; setuptools 83+ needs >=3.10
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]
